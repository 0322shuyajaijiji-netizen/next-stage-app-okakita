<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXT STAGE for okakita students</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #FFFBEB;
            --neo-black: #1A1A1A;
            --neo-blue: #3B82F6;
            --neo-green: #22C55E;
            --neo-red: #EF4444;
            --neo-yellow: #FDE047;
            --neo-shadow: 4px 4px 0px #1A1A1A;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-cream);
            color: var(--neo-black);
            overflow-x: hidden;
        }

        .neo-card {
            background: white;
            border: 3px solid var(--neo-black);
            box-shadow: var(--neo-shadow);
            border-radius: 12px;
        }

        .neo-button {
            background: white;
            border: 3px solid var(--neo-black);
            box-shadow: var(--neo-shadow);
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.1s;
            cursor: pointer;
        }

        .neo-button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--neo-black);
        }

        .neo-button-primary { background: var(--neo-blue); color: white; }
        .neo-button-yellow { background: var(--neo-yellow); color: var(--neo-black); }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .correct-ping {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 150px; height: 150px; border: 15px solid var(--neo-green);
            border-radius: 50%; opacity: 0; pointer-events: none; z-index: 100;
        }
        .ping-animate { animation: pingAction 0.8s ease-out; }
        @keyframes pingAction { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.8; } 100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; } }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <!-- Password Auth Screen -->
    <div id="auth-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-[#FFFBEB] p-4">
        <div class="neo-card p-8 w-full max-w-sm text-center fade-in">
            <div class="mb-6">
                <span class="text-4xl">🔐</span>
            </div>
            <h2 class="text-2xl font-black mb-2 uppercase italic">Verification</h2>
            <p class="text-sm font-bold opacity-60 mb-6">パスワードを入力してください</p>
            
            <div class="space-y-4 text-left">
                <input 
                    type="password" 
                    id="password-input" 
                    placeholder="Enter password..."
                    class="w-full px-4 py-3 border-3 border-black rounded-xl focus:outline-none bg-white font-bold tracking-widest text-center"
                >
                <div id="auth-error" class="text-red-600 text-xs font-bold h-4 opacity-0 transition-opacity">
                    Incorrect password. Try again.
                </div>
                <button 
                    onclick="handleLogin()" 
                    class="neo-button neo-button-primary w-full py-4 text-lg"
                >
                    UNLOCK 🚀
                </button>
            </div>
        </div>
    </div>

    <!-- Main App Content (Hidden by default) -->
    <div id="app" class="max-w-2xl mx-auto hidden">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div onclick="showChapterMenu()" class="neo-card px-4 py-2 bg-white flex items-center gap-2 cursor-pointer hover:bg-gray-50">
                <span class="font-black text-xl uppercase tracking-tighter">NEXT STAGE for okakita students</span>
            </div>
            <div id="header-stats" class="hidden text-right">
                <p class="text-xs font-bold opacity-50 uppercase tracking-widest" id="chapter-label"></p>
                <p class="font-black text-lg" id="progress-text"></p>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-container" class="fade-in"></main>

        <!-- Explanation Modal -->
        <div id="explanation-area" class="hidden mt-8 fade-in pb-12">
            <div class="neo-card p-6 border-t-8 border-t-blue-500">
                <div class="flex justify-between items-start mb-4">
                    <h3 class="text-2xl font-black">💡 解説</h3>
                    <button id="bookmark-btn" class="neo-button px-3 py-1 flex items-center gap-1 text-sm">
                        <span id="bookmark-icon">☆</span> ブックマーク
                    </button>
                </div>
                <div id="explanation-content" class="space-y-4 text-lg"></div>
                <div id="one-point-box" class="mt-6 p-4 bg-blue-50 border-2 border-blue-200 rounded-xl italic">
                    <span class="font-bold not-italic">ワンポイント:</span> <span id="one-point-text"></span>
                </div>
                <div class="mt-8">
                    <button id="next-btn" class="neo-button neo-button-primary w-full py-5 text-xl">次の問題へ！ 🚀</button>
                </div>
            </div>
        </div>
    </div>

    <div id="correct-ping" class="correct-ping"></div>

    <script>
        // --- AUTH CONFIG ---
        const VALID_PASSWORD = "okakita2026";

        function handleLogin() {
            const input = document.getElementById('password-input');
            const error = document.getElementById('auth-error');
            const authScreen = document.getElementById('auth-screen');
            const app = document.getElementById('app');

            if (input.value === VALID_PASSWORD) {
                authScreen.classList.add('hidden');
                app.classList.remove('hidden');
                init(); // Start the app
            } else {
                error.style.opacity = '1';
                input.classList.add('border-red-500');
                input.value = '';
                input.focus();
                setTimeout(() => { 
                    error.style.opacity = '0'; 
                    input.classList.remove('border-red-500');
                }, 3000);
            }
        }

        // Enter key for password input
        document.getElementById('password-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        // --- DATA ---
        const chapters = [
            {
                id: "tense",
                title: "Chapter 1: 時制 (Tense)",
                questions: [
                    { id: "t1", question: "Glen and Wilma usually (　　　) their washing on weekends.", options: ["are done", "do", "have been doing", "have done"], correct: 1, explanation: "習慣を表す現在形なので do が正しい。", translation: "グレンとウィルマはふだん、週末に洗濯をします。", onePoint: "usuallyなどの頻度を表す副詞がある時は現在形を疑いましょう。" },
                    { id: "t2", question: "“What did you do last night?” “I watched TV, practiced the piano, and (　　　) my homework.”", options: ["did", "have done", "would do", "do"], correct: 0, explanation: "過去の出来事なので過去形 did を使う。", translation: "「昨夜は何をしましたか？」「テレビを見て、ピアノを練習して、宿題をしました。」", onePoint: "過去の動作を並める時はすべて過去形に揃えます。" },
                    { id: "t3", question: "If you turn left and go straight, you (　　　) the station on your right.", options: ["are found", "found", "have found", "will find"], correct: 3, explanation: "条件文で未来の結果を表すため will find を使う。", translation: "左に曲がって真っ直ぐ行けば、右手に駅が見えますよ。", onePoint: "if節（もし〜なら）の中は現在形ですが、結果を述べる主節は未来形になります。" },
                    { id: "t4", question: "When Tom came home, Mary (　　　) a book in the living room.", options: ["has read", "is reading", "reads", "was reading"], correct: 3, explanation: "過去のある時点で進行中だった動作なので過去進行形 was reading。", translation: "トムが帰宅したとき、メアリーは居間で本を読んでいました。", onePoint: "「〜した時、ちょうど〜していた」はwhen+過去形, 過去進行形のコンビが多いです。" },
                    { id: "t5", question: "I (　　　) for a trading company in Tokyo at this time next year.", options: ["have been working", "will be working", "have worked", "was working"], correct: 1, explanation: "未来のある時点で進行中の動作なので未来進行形 will be working。", translation: "来年の今ごろ、私は東京の商社で働いているでしょう。", onePoint: "at this time next yearのような「未来の特定の瞬間」は未来進行形が馴染みます。" },
                    { id: "t6", question: "Listen! I (　　　) a funny noise outside.", options: ["hear", "am hearing", "had been hearing", "had heard"], correct: 0, explanation: "知覚動詞 hear は通常進行形にしないので現在形。", translation: "聞いて！外で変な音が聞こえるよ。", onePoint: "状態を表す動詞（know, like, hearほど）は進行形にしないのが原則です。" },
                    { id: "t7", question: "We (　　　) each other since we met in junior high school six years ago.", options: ["were known", "were knowing", "have known", "have been knowing"], correct: 2, explanation: "since があるため現在完了 have known。", translation: "私たちは6年前に中学で会って以来、お互いを知っています。", onePoint: "since（〜以来）は現在完了形（継続）の強力なヒントです。" },
                    { id: "t8", question: "“Are John and Mary still living in New York?” “No, they (　　　) to Dallas.”", options: ["are just moved", "had just moved", "have just moved", "will just move"], correct: 2, explanation: "「ちょうど〜したところ」は現在完了 have just moved。", translation: "「ジョンとメアリーはまだニューヨークに住んでいますか？」「いいえ、ちょうどダラスへ引っ越したところです。」", onePoint: "just（ちょうど）は完了を表す現在完了形と一緒に使われます。" },
                    { id: "t9", question: "Next Sunday he (　　　) in Kobe for three years.", options: ["has stayed", "stays", "will stay", "will have stayed"], correct: 3, explanation: "未来のある時点までの継続なので未来完了 will have stayed。", translation: "次の日曜日で、彼は神戸に3年滞在したことになります。", onePoint: "未来のある時点までの期間（for ...）を言う時は未来完了を使います。" },
                    { id: "t10", question: "When we arrived at the hotel, the wedding (　　　) already.", options: ["started", "starts", "had started", "has started"], correct: 2, explanation: "過去のある時点より前なので過去完了 had started。", translation: "私たちがホテルに到着したとき、結婚式はすでに始まっていました。", onePoint: "到着した（過去）時点で既に終わっていたので、さらに過去（大過去）を表す had を使います。" },
                    { id: "t11", question: "When I went back to the town I (　　　) eight years before, everything was different.", options: ["was leaving", "have left", "had left", "was left"], correct: 2, explanation: "8年前にすでに去っていたので過去完了 had left。", translation: "8年前に去った町に戻ったとき、すべてが変わっていました。", onePoint: "beforeがあると過去完了が使われやすいです。" },
                    { id: "t12", question: "Sandy (　　　) in the library when I saw her two hours ago.", options: ["has studied", "was studying", "has been studying", "is studying"], correct: 1, explanation: "過去のある時点で進行中なので過去進行形。", translation: "2時間前に私が見たとき、サンディは図書館で勉強していました。", onePoint: "特定の過去の瞬間での動作は進行形にします。" },
                    { id: "t13", question: "I haven’t seen Tom for a long time. When (　　　) him last?", options: ["have you seen", "had you seen", "do you see", "did you see"], correct: 3, explanation: "last があるため過去形 did you see が正しい。", translation: "トムに長い間会っていません。最後に彼に会ったのはいつですか？", onePoint: "When疑問文では現在完了形を使わないのが原則です。" },
                    { id: "t14", question: "I have just (　　　) to the airport to see my friends off.", options: ["been", "gone", "come", "arrived"], correct: 0, explanation: "行って戻ってきた場合は have been を使う。", translation: "友達を見送りに空港へ行ってきたところです。", onePoint: "have gone toだと「行ってしまって今はここにいない」になります。" },
                    { id: "t15", question: "Mary is absent today. She (　　　) to Hokkaido.", options: ["comes", "has been", "has gone", "has arrived"], correct: 2, explanation: "行ってまだ戻っていないので has gone。", translation: "メアリーは今日欠席です。彼女は北海道へ行ってしまいました。", onePoint: "「今はもういない」という結果を含みます。" },
                    { id: "t16", question: "I (　　　) for a present for my teacher since last week, but I can’t find one.", options: ["had been looking", "have been looking", "am looking", "was looking"], correct: 1, explanation: "since があるので現在完了進行形 have been looking。", translation: "先週からずっと先生へのプレゼントを探していますが、見つかりません。", onePoint: "動作の継続を強調したいときは完了進行形を使います。" },
                    { id: "t17", question: "We (　　　) for nearly thirty minutes when the train arrived.", options: ["had been waiting", "have been waiting", "have waited", "will have waited"], correct: 0, explanation: "到着前までの継続なので過去完了進行形。", translation: "列車が到着したとき、私たちは30分近くずっと待っていました。", onePoint: "「過去のある時点までずっと〜していた」を表します。" },
                    { id: "t18", question: "We (　　　) each other since we entered this college.", options: ["are knowing", "knew", "have known", "would know"], correct: 2, explanation: "since により現在完了 have known。", translation: "この大学に入学して以来、私たちはお互いを知っています。", onePoint: "knowは状態動詞なので進行形にしません。" },
                    { id: "t19", question: "I’ll be at home watching TV until (　　　).", options: ["you come back", "you be back", "you will be back", "you will have been back"], correct: 0, explanation: "時・条件節では未来のことでも現在形。", translation: "あなたが帰ってくるまで、私は家でテレビを見ています。", onePoint: "untilの後ろは未来のことでも現在形にします。" },
                    { id: "t20", question: "When I (　　　) a thousand English words, will I be able to read an English newspaper?", options: ["am learning", "have learned", "will have learned", "will learn"], correct: 1, explanation: "完了した条件を表すので現在完了 have learned。", translation: "1000個の英単語を覚えたら、英字新聞が読めるようになるでしょうか？", onePoint: "未来完了の意味でも時制の一致で現在完了になります。" },
                    { id: "t21", question: "Can you give me a call when you (　　　) at the airport?", options: ["arrive", "arrived", "will arrive", "are arrived"], correct: 0, explanation: "when節内は未来でも現在形。", translation: "空港に到着したら電話をくれますか？", onePoint: "「〜するとき」という副詞節のツールです。" },
                    { id: "t22", question: "Mr. Tanaka is out now, and I don’t know when he (　　　) in the office.", options: ["will be back", "is back", "is being back", "be back"], correct: 0, explanation: "いつ戻るかという名詞節なので will が必要。", translation: "田中さんは今外出しています。いつオフィスに戻るか分かりません。", onePoint: "名詞節のwhenにはwillが使えます。" },
                    { id: "t23", question: "We will go to the open market tomorrow if the weather (　　　) nice.", options: ["will have been", "is", "were", "had been"], correct: 1, explanation: "if節（条件）内は未来でも現在形。", translation: "もし明日天気が良ければ、オープンマーケットに行きましょう。", onePoint: "副詞節のifではwillを使いません。" },
                    { id: "t24", question: "She is not sure if he (　　　) to today’s welcome party for the overseas students.", options: ["comes", "had come", "will come", "would come"], correct: 2, explanation: "「〜かどうか」という名詞節なので will を使う。", translation: "彼女は、彼が今日の留学生歓迎会に来るかどうか確信がありません。", onePoint: "名詞節のifにはwillが使えます。" },
                    { id: "t25", question: "Will you hand this message to her when she (　　　) home?", options: ["will come", "came", "comes", "is coming"], correct: 2, explanation: "when節内は未来でも現在形。", translation: "彼女が家に帰ってきたら、このメッセージを渡してくれますか？", onePoint: "副詞節の時制ルールを再確認しましょう。" },
                    { id: "t26", question: "Last year I gave him a book for his birthday, but at the party next week I (　　　) him a CD.", options: ["am going to give", "give", "have given", "will have given"], correct: 0, explanation: "未来の予定なので be going to。", translation: "去年は彼の誕生日に本をあげましたが、来週のパーティーではCDをあげるつもりです。", onePoint: "決まっている予定はbe going toが適しています。" }
                ]
            },
            {
                id: "passive",
                title: "Chapter 2: 受動態 (Passive Voice)",
                questions: [
                    { id: "p1", question: "“This temple is beautiful. How old is it?” “It (　　　) in 1343.”", options: ["was built", "built", "was building", "build"], correct: 0, explanation: "受動態。1343年なので過去形 was built。", translation: "「このお寺は美しいですね。どれくらい古いのですか？」「1343年に建てられました。」", onePoint: "be + 過去分詞 で「〜される」。" },
                    { id: "p2", question: "The music at the dance was very loud and (　　　) from far away.", options: ["can hear", "can have heard", "could be heard", "could be hearing"], correct: 2, explanation: "受動態. 過去なので could be heard。", translation: "ダンスパーティーの音楽はとても大きく、遠くからでも聞こえました。", onePoint: "助動詞の受動態は「助動詞 + be + 過去分詞」。" },
                    { id: "p3", question: "The temperature in the refrigerator (　　　) low so that the food there will not go bad.", options: ["should kept", "should be kept", "should keeping", "should be keeping"], correct: 1, explanation: "受動態。べきであるの should を伴う。", translation: "食品が傷まないように、冷蔵庫の温度は低く保たれるべきです。", onePoint: "keep O C の受動態は O be kept C です。" },
                    { id: "p4", question: "I have to find a policeman as soon as possible because my bag (　　　).", options: ["has been stealing", "has been stolen", "has stolen", "was being stolen"], correct: 1, explanation: "完了の受動態 has been stolen。", translation: "バッグが盗まれてしまったので、できるだけ早く警察官を見つけなければなりません。", onePoint: "現在完了の受動態は have been p.p. です。" },
                    { id: "p5", question: "While the presentation (　　　), the teachers were taking notes.", options: ["was being given", "has been given", "was giving", "gave"], correct: 0, explanation: "進行形の受動態 was being given。", translation: "プレゼンテーションが行われている間、先生方はメモを取っていました。", onePoint: "進行形の受動態は be being p.p. です。" },
                    { id: "p6", question: "On his way home, Taro was (　　　) a stranger.", options: ["spoken at", "spoken to by", "spoken by", "spoken with by"], correct: 1, explanation: "speak to の塊を受動態にする。", translation: "家に帰る途中、タロウは見知らぬ人に話しかけられました。", onePoint: "群動詞は前置詞を落とさないよう注意。" },
                    { id: "p7", question: "He has never (　　　) Alaska.", options: ["been heard from since he left for", "heard from been since he left for", "been hearing from since he left for", "heard since he left from for"], correct: 0, explanation: "hear from の受動態。", translation: "アラスカに向けて出発して以来、彼からは一度も連絡がありません。", onePoint: "特殊な受動態表現です。" },
                    { id: "p8", question: "To tell the truth, I’m not much (　　　) in your story.", options: ["interest", "interesting", "interestingly", "interested"], correct: 3, explanation: "人の感情は過去分詞で表す。", translation: "実を言うと、あなたの話にはあまり興味がありません。", onePoint: "be interested in は定番です。" },
                    { id: "p9", question: "She was caught (　　　) home.", options: ["in a shower on her way", "on her way in a shower", "in her way on a shower", "on a shower in her way"], correct: 0, explanation: "be caught in a shower（雨にあう）。", translation: "彼女は帰宅途中ににわか雨にあいました。", onePoint: "by以外の前置詞を使う例です。" }
                ]
            },
            {
                id: "auxiliary",
                title: "Chapter 3: 助動詞 (Auxiliary Verbs)",
                questions: [
                    { id: "a1", question: "“Have you seen Jim?” “No, but he (　　　) be at his desk.”", options: ["may", "ought", "must not", "can’t"], correct: 0, explanation: "「〜かもしれない」という推量を表す may が適当です。", translation: "「ジムを見かけましたか？」「いいえ、でも彼は机にいるかもしれません。」", onePoint: "不確実な推量は may です。" },
                    { id: "a2", question: "“(　　　) you succeed!” he said to me.", options: ["May", "Wanting", "Had", "Wished"], correct: 0, explanation: "祈願文なので May を用いる。", translation: "「あなたが成功しますように！」と彼は私に言った。", onePoint: "祈願文ではMayが文頭に来ます。" },
                    { id: "a3", question: "He (　　　) be over thirty; he must still be in his twenties.", options: ["may", "must", "can’t", "oughtn’t"], correct: 2, explanation: "強い否定の推量なので can’t。", translation: "彼が30歳を超えているはずがありません。まだ20代のはずです。", onePoint: "「〜のはずがない」は can't。" },
                    { id: "a4", question: "The boy solved the problem faster than anybody else. He (　　　) be very intelligent.", options: ["had better", "must", "ought", "can’t"], correct: 1, explanation: "強い確信の推量は must。", translation: "その少年は誰よりも早く問題を解いた。彼はとても知能が高いに違いない。", onePoint: "「〜に違違いない」は must。" },
                    { id: "a5", question: "Hurry! The meeting starts at seven. We (　　　) be late.", options: ["needn’t", "don’t have to", "have to", "mustn’t"], correct: 3, explanation: "「〜してはいけない」は mustn’t。", translation: "急いで！会議は7時に始まります。遅れてはいけません。", onePoint: "禁止を表す助動詞です。" },
                    { id: "a6", question: "I couldn’t go out with my friends last night because I (　　　) finish my homework.", options: ["had to", "must", "must have", "might"], correct: 0, explanation: "過去の義務なので had to。", translation: "昨夜は宿題を終わらせなければならなかったので、友達と外出できませんでした。", onePoint: "mustの過去は had to。" },
                    { id: "a7", question: "You (　　　) go to university today because all the lectures are cancelled.", options: ["don’t have to", "may", "ought to", "should"], correct: 0, explanation: "「〜する必要がない」は don’t have to。", translation: "今日は講義がすべて休講なので、大学に行く必要はありません。", onePoint: "不必要を表します。" },

{ id: "c22p191_1122", question: "Mary told him once and for all that she wouldn’t go out with him.", options: ["all at once", "many times", "in the first place", "in a final manner"], correct: 3, explanation: "once and for all「きっぱりと／最終的に」。", translation: "メアリーは，彼とデートをするつもりはないときっぱり彼に言った。", onePoint: "完全に決着つけるニュアンス。" }

{  "id": "idioms25",
  "title": "Chapter 25: 名詞を含むイディオム",
  "questions": [
{ id: "c23p192_1123", question: "He is (　　　) nature a wise, kind man.", options: ["by", "for", "to", "with"], correct: 0, explanation: "by nature「生まれつき」。", translation: "彼は，生まれつき賢くて優しい男性です。", onePoint: "by nature = 生来の性質。" },
{ id: "c23p192_1124", question: "If you want to know anything (　　　) detail, feel free to email me.", options: ["along", "at", "in", "off"], correct: 2, explanation: "in detail「詳しく」。", translation: "詳しくお知りになりたいことが何かあるときは，遠慮なく私宛てにEメールをお送りください。", onePoint: "detail は in とセット。" },
{ id: "c23p192_1125", question: "No one knows (　　　) if there is life on other planets.", options: ["certain", "for certain", "better", "to be sure"], correct: 1, explanation: "for certain「確かに」。", translation: "他の惑星に生命体が存在するかどうかは，誰もはっきりとはわからない。", onePoint: "know for certain = 確実に知っている。" },
{ id: "c23p192_1126", question: "Mr. Patterson arrived (　　　) time, not a minute early or a minute late.", options: ["at", "for", "in", "on"], correct: 3, explanation: "on time「時間どおりに」。", translation: "パターソンさんは，１分早くも遅くもなく，時間どおりに着いた。", onePoint: "on time ↔ in time（間に合う）。" },
{ id: "c23p192_1127", question: "Tom will be able to arrive (　　　) for the ceremony.", options: ["in time", "off limit", "time off", "time slip"], correct: 0, explanation: "in time「間に合って」。", translation: "トムは，式典に間に合うように到着できるでしょう。", onePoint: "in time = ギリ間に合う。" },
{ id: "c23p192_1128", question: "I didn’t like the book at first, but (　　　) degrees I got to enjoy reading it.", options: ["by", "in", "on", "with"], correct: 0, explanation: "by degrees「だんだんと」。", translation: "最初はその本が好きでなかったが，だんだんと読むのが楽しくなってきた。", onePoint: "gradually と同義。" },
{ id: "c23p192_1129", question: "I would like to speak to you (　　　) private.", options: ["at", "in", "of", "to"], correct: 1, explanation: "in private「内密に」。", translation: "あなたと内密にお話ししたいのですが。", onePoint: "private は in と結びつく。" },
{ id: "c23p192_1130", question: "Mr. Takizawa and Mr. Higashi are (　　　) work now.", options: ["on", "at", "from", "by"], correct: 1, explanation: "at work「仕事中」。", translation: "タキザワさんとヒガシさんは今，仕事中です。", onePoint: "at work ↔ at home。" },
{ id: "c23p192_1131", question: "Instead of sending somebody on your behalf, you had better go and speak in (　　　).", options: ["change", "line", "person", "yourself"], correct: 2, explanation: "in person「直接」。", translation: "あなたの代理を行かせるのではなく，あなたが出向いて直接話す方がいいでしょう。", onePoint: "直接会うニュアンス。" },
{ id: "c23p192_1132", question: "You should take an umbrella with you just (　　　) case.", options: ["at", "of", "as", "in"], correct: 3, explanation: "just in case「念のため」。", translation: "念のため傘を持っていくべきだ。", onePoint: "会話でよく使う定番表現。" },
{ id: "c23p192_1133", question: "The policeman was (　　　) that night.", options: ["on purpose", "in advance", "by accident", "on duty"], correct: 3, explanation: "on duty「勤務中」。", translation: "その警官は，その晩は勤務に当たっていた。", onePoint: "duty = 任務。" },
{ id: "c23p192_1134", question: "The escaped prisoners are still (　　　) in the area.", options: ["at stake", "at large", "at random", "at any cost"], correct: 1, explanation: "at large「逃走中の」。", translation: "脱獄した囚人たちは，いまだにその地域を逃亡中である。", onePoint: "ニュース英語で頻出。" },
{ id: "c23p192_1135", question: "When he writes, he always keeps a dictionary (　　　).", options: ["at hand", "from hand", "for hand", "with hand"], correct: 0, explanation: "at hand「手元に」。", translation: "ものを書くときには，彼はいつも手元に辞書を置いておく。", onePoint: "hand を使う重要表現。" },
{ id: "c23p192_1136", question: "At the beginning of each term I always tell some jokes to make the newcomers feel (　　　) ease.", options: ["at", "for", "of", "with"], correct: 0, explanation: "feel at ease「くつろぐ」。", translation: "各学期の始まりの際に，新入生の気持ちを和らげるために，私はいつも冗談をいくつか言う。", onePoint: "ease = 安心。" },
{ id: "c23p192_1137", question: "Three sites are (　　　) consideration for the new factory.", options: ["above", "of", "under", "with"], correct: 2, explanation: "under consideration「検討中」。", translation: "新しい工場用に３か所の敷地が検討されている。", onePoint: "under は「進行中」ニュアンス。" },
{ id: "c23p192_1138", question: "We’ll soon have to tackle the problem (　　　) earnest.", options: ["in", "at", "for", "on"], correct: 0, explanation: "in earnest「本気で」。", translation: "私たちはまもなく，まじめにその問題に取り組まなければならないだろう。", onePoint: "earnest = 真剣。" },
{ id: "c23p192_1139", question: "They have nothing at all (　　　) common.", options: ["on", "with", "for", "in"], correct: 3, explanation: "have nothing in common「共通点がない」。", translation: "彼らには共通点がまったくない。", onePoint: "common は in とセット。" },
{ id: "c23p192_1140", question: "I found it elegant furniture, but it was not (　　　) sale.", options: ["for", "with", "all", "others"], correct: 0, explanation: "for sale「売り物の」。", translation: "私はそれを上品な家具だと思ったが，それは売り物ではなかった。", onePoint: "sale = 販売。" },
{ id: "c23p192_1141", question: "I used to live in Sydney, but (　　　) present I’m living in Tokyo.", options: ["for", "on", "at", "in"], correct: 2, explanation: "at present「現在は」。", translation: "私はかつてシドニーに住んでいたが，現在は東京に住んでいる。", onePoint: "present = 今。" },
{ id: "c23p192_1142", question: "Children need many things, but, above all, they need love.", options: ["voluntarily", "especially", "far from", "on earth"], correct: 1, explanation: "above all「とりわけ」。", translation: "子どもたちはたくさんのものを必要とするが，とりわけ愛情を必要とする。", onePoint: "最重要ポイントを強調。" },
{ id: "c23p192_1143", question: "He will get here before long.", options: ["soon", "late", "later", "early"], correct: 0, explanation: "before long「まもなく」。", translation: "彼はまもなくここに到着するでしょう。", onePoint: "long があっても未来近い。" },
{ id: "c23p192_1144", question: "That American student is quite at home in Japanese politics.", options: ["well off in", "elastic in", "knowledgeable about", "easy with"], correct: 2, explanation: "be at home in 〜「〜に精通している」。", translation: "あのアメリカ人の学生は，日本の政治にとても精通している。", onePoint: "home = 得意分野。" },
{ id: "c23p192_1145", question: "Penny feels at home with Roger’s family.", options: ["regular", "at heart", "on edge", "comfortable"], correct: 3, explanation: "feel at home「くつろぐ」。", translation: "ペニーはロジャーの家族といると気楽である。", onePoint: "居心地が良い感覚。" },
{ id: "c23p192_1146", question: "He sat there for hours on end.", options: ["silently", "continuously", "at last", "strait"], correct: 1, explanation: "on end「続けて」。", translation: "彼は何時間もずっとそこに座っていた。", onePoint: "end = 継続。" },
{ id: "c23p192_1147", question: "The project is not yet under way.", options: ["closed down", "set about", "in progress", "half over"], correct: 2, explanation: "under way「進行中」。", translation: "その計画はまだ進行していない。", onePoint: "startされた状態。" },
{ id: "c23p192_1148", question: "You must return my money next Friday without fail.", options: ["for certain", "partly", "eventually", "thoroughly"], correct: 0, explanation: "without fail「必ず」。", translation: "あなたは，今度の金曜日に必ず私にお金を返さなければならない。", onePoint: "fail = 失敗 → 絶対に外さない。" },
{ id: "c23p192_1149", question: "They knew about it in advance.", options: ["at most", "beforehand", "for certain", "least of all"], correct: 1, explanation: "in advance「前もって」。", translation: "そのことについて，彼らはあらかじめ知っていた。", onePoint: "advance = 前。" },
{ id: "c23p192_1150", question: "I met her sister on the campus by chance.", options: ["unwillingly", "fortunately", "reasonably", "accidentally"], correct: 3, explanation: "by chance「偶然に」。", translation: "私は，キャンパスで彼女の姉［妹］さんに偶然会った。", onePoint: "chance = 偶然。" },
{ id: "c23p192_1151", question: "At length the two countries reached an agreement after much discussion.", options: ["Strongly", "Before long", "At last", "Easily"], correct: 2, explanation: "at length「ついに」= at last。", translation: "多くの議論を重ね，ついにその２国は協定を結んだ。", onePoint: "length は時間の長さ→ついに。" },
{ id: "c23p192_1152", question: "All my efforts were for nothing.", options: ["unlikely", "in vain", "unhappily", "for granted"], correct: 1, explanation: "for nothing「むだに」= in vain。", translation: "私の努力は，すべてむだになった。", onePoint: "vain = 無駄。" },
{ id: "c23p192_1153", question: "I think she did it on purpose.", options: ["accidentally", "intentionally", "reluctantly", "willingly"], correct: 1, explanation: "on purpose「わざと」= intentionally。", translation: "私は彼女がそれをわざとしたと思う。", onePoint: "purpose = 意図。" },
{ id: "c23p192_1154", question: "In short they had a difficult trip.", options: ["At least", "For a while", "For instance", "To sum up"], correct: 3, explanation: "in short「要するに」= to sum up。", translation: "要するに，彼らはつらい旅をしたのだ。", onePoint: "まとめ表現。" },
{ id: "c23p192_1155", question: "The two students told their teacher about the strange experience by turns.", options: ["persuasively", "alternately", "repeatedly", "expressively"], correct: 1, explanation: "by turns「交互に」= alternately。", translation: "その２人の学生は，先生にその奇妙な体験のことを，かわるがわる語った。", onePoint: "turn = 順番。" },
{ id: "c23p192_1156", question: "Has Jack left the office for good this time?", options: ["excellently", "truly", "permanently", "willingly"], correct: 2, explanation: "for good「永久に」。", translation: "ジャックは今回，これを最後に会社を辞めたのですか。", onePoint: "good = 完全に のニュアンス。" },
{ id: "c23p192_1157", question: "Yesterday I cut my finger by mistake.", options: ["willingly", "deeply", "accidentally", "intentionally"], correct: 2, explanation: "by mistake「誤って」= accidentally。", translation: "昨日，私は誤って指を切った。", onePoint: "mistake = ミス。" },
{ id: "c23p193_1158", question: "We mustn’t speak ill of a man (　　　) his back.", options: ["over", "after", "behind", "under"], correct: 2, explanation: "behind one’s back「陰で」。", translation: "私たちは，陰で人の悪口を言ってはならない。", onePoint: "behind = 見えないところで。" },
{ id: "c23p193_1159", question: "In the judo match, he threw his opponent (　　　) no time at all.", options: ["at", "in", "on", "to"], correct: 1, explanation: "in no time「すぐに」。", translation: "柔道の試合で，彼は相手をあっという間に投げ飛ばした。", onePoint: "no time = 時間ゼロ感覚。" },
{ id: "c23p193_1160", question: "He thinks that life is a voyage in a (　　　).", options: ["score", "sense", "extent", "extension"], correct: 1, explanation: "in a sense「ある意味では」。", translation: "彼は，ある意味では人生とは航海だ，と考える。", onePoint: "sense = 観点。" },
{ id: "c23p193_1161", question: "I can express myself in English (　　　), but I still have a lot to learn.", options: ["as much as possible", "by all means", "to some extent", "for the moment"], correct: 2, explanation: "to some extent「ある程度」。", translation: "ある程度は英語で言いたいことが言えますが，まだまだ学ぶべきことがたくさんあります。", onePoint: "extent = 程度。" },
{ id: "c23p193_1162", question: "She refused to do what they wanted. (　　　), she wasn’t going to let them push her around.", options: ["Overall", "By the way", "In other words", "In all"], correct: 2, explanation: "in other words「言い換えれば」。", translation: "彼女は，彼らが望むことをするのを拒絶した。言いかえれば，彼女は彼らに，自分をこき使わせないようにしたのだ。", onePoint: "言い換え表現。" },
{ id: "c23p193_1163", question: "I glance through the newspapers and watch TV every day so as not to be (　　　) the times.", options: ["up", "behind", "late", "slow"], correct: 1, explanation: "behind the times「時代遅れで」。", translation: "時代に遅れないように，私は毎日，新聞にざっと目を通し，テレビを見ている。", onePoint: "behind = 遅れ。" },
{ id: "c23p193_1164", question: "I would like to withdraw comment on that for the present.", options: ["right away", "to the moment", "now and then", "for the time being"], correct: 3, explanation: "for the time being「当分の間」。", translation: "当分の間はその件に関する見解を差し控えることにしたい。", onePoint: "temporary のニュアンス。" },
{ id: "c23p193_1165", question: "Most students finish their coursework by the end of May as a (　　　).", options: ["majority", "real", "rule", "fact"], correct: 2, explanation: "as a rule「概して」。", translation: "たいていの学生は，概して５月末までには彼らの学習課程を終える。", onePoint: "一般論表現。" },
{ id: "c23p193_1166", question: "We were at a (　　　) where to go.", options: ["cross", "loss", "road", "crossroad"], correct: 1, explanation: "at a loss「途方に暮れて」。", translation: "どこに行ったらいいのか，私たちは途方にくれた。", onePoint: "loss = どうしていいかわからない状態。" },
{ id: "c23p193_1167", question: "I’d like to see the merchandise (　　　).", options: ["at first hand", "at a first hand", "at the first hand", "at first hands"], correct: 0, explanation: "at first hand「直接」。", translation: "直接，商品を見たいのですが。", onePoint: "first hand = 直接体験。" },
{ id: "c23p193_1168", question: "Children are likely to get (　　　) if no one cares about disciplining them.", options: ["away from the hand", "away from hand", "out of hand", "out of the hand"], correct: 2, explanation: "out of hand「手に負えなくなる」。", translation: "子どもたちは，もし彼らのしつけを気づかう人がいなければ，手に負えなくなるだろう。", onePoint: "control不能のイメージ。" },
{ id: "c23p193_1169", question: "“Could you tell me where the elevator is?” “I’m sorry, but it’s out of (　　　).”", options: ["energy", "hand", "order", "place"], correct: 2, explanation: "out of order「故障中」。", translation: "「エレベーターがどこにあるか教えていただけませんか」「申し訳ございませんが，エレベーターは故障しています」", onePoint: "order = 正常状態。" },
{ id: "c23p193_1170", question: "(a) This type of shoe is no longer in fashion. (b) This type of shoe is out of (　　　).", options: ["date", "order", "leather", "shine"], correct: 0, explanation: "out of date「時代遅れ」。", translation: "(a) この型の靴はもはやはやっていない。(b) この型の靴は時代遅れだ。", onePoint: "date = 時代。" },
{ id: "c23p193_1171", question: "Your explanation was very much to the (　　　).", options: ["dot", "place", "point", "spot"], correct: 2, explanation: "to the point「要点をついて」。", translation: "君の説明は，とても要領を得ていた。", onePoint: "point = 要点。" },
{ id: "c23p193_1172", question: "In the late 1700’s and early 1800’s, neoclassical architecture was (　　　) its best.", options: ["at", "by", "in", "on"], correct: 0, explanation: "at one’s best「絶頂で」。", translation: "1700年代後半と1800年代前半は，新古典主義的な建築様式の全盛期だった。", onePoint: "best = 最盛期。" },
{ id: "c23p193_1173", question: "Students travel half-price on that airline. (　　　), have you bought your ticket for New York yet?", options: ["As a result", "By the way", "Nevertheless", "What is more"], correct: 1, explanation: "by the way「ところで」。", translation: "あの航空会社には，学生は半額で乗れます。ところで，あなたはもうニューヨーク行きの航空券を買ってしまいましたか。", onePoint: "話題転換表現。" },
{ id: "c23p193_1174", question: "Take a camera (　　　) ─ there will be a chance of some unforgettable shots during the trip.", options: ["by all means", "by any chance", "by chance", "by no means"], correct: 0, explanation: "by all means「ぜひとも」。", translation: "ぜひともカメラを持って行きなさい。旅行中には，思い出に残る写真を撮る機会があるだろうから。", onePoint: "強い肯定。" },
{ id: "c23p193_1175", question: "That picture doesn’t seem ugly to me; (　　　), I think it’s beautiful.", options: ["however", "in opposition", "on the contrary", "on the other hand"], correct: 2, explanation: "on the contrary「それどころか」。", translation: "その絵は，私には見苦しいとは思えません。それどころか，美しいと思います。", onePoint: "強い逆接。" },
{ id: "c23p193_1176", question: "He went to see the football game in spite of his doctor’s advice (　　　) the contrary.", options: ["in", "on", "at", "to"], correct: 3, explanation: "to the contrary「それに反して」。", translation: "医者の忠告にもかかわらず，それに逆らって彼はフットボールの試合を見に行った。", onePoint: "contrary = 反対。" },
{ id: "c23p193_1177", question: "Keep all medicines out of (　　　) of our baby.", options: ["touch", "hand", "reach", "area"], correct: 2, explanation: "out of reach「手の届かないところに」。", translation: "薬はすべて，赤ちゃんの手の届かないところに置いておいて。", onePoint: "安全表現。" },
{ id: "c23p193_1178", question: "A few minutes later, the helicopter was out of (　　　).", options: ["date", "question", "season", "sight"], correct: 3, explanation: "out of sight「見えなくなる」。", translation: "数分後，ヘリコプターは視界から見えなくなった。", onePoint: "視覚表現。" },
{ id: "c23p193_1179", question: "Ms. Kato is a famous designer, and in her (　　　), long skirts will be in fashion this year.", options: ["opinion", "point", "voice", "order"], correct: 0, explanation: "in one’s opinion「〜の考えでは」。", translation: "カトウさんは有名なデザイナーで，彼女の考えでは，今年はロングスカートがはやるそうだ。", onePoint: "意見表現。" },
{ id: "c23p193_1180", question: "We must prevent that kind of disaster (　　　).", options: ["with any expenses", "to any cost", "with any risks", "at all costs"], correct: 3, explanation: "at all costs「どんな犠牲を払ってでも」。", translation: "私たちは，あのような大惨事はどんな犠牲を払ってでも防がなければならない。", onePoint: "強い決意。" },
{ id: "c23p193_1181", question: "On (　　　) thoughts, I agreed to his plan.", options: ["repeated", "second", "twice", "two"], correct: 1, explanation: "on second thoughts「考え直して」。", translation: "考え直してみて，私は彼の計画に賛成した。", onePoint: "再考の表現。" },
{ id: "c23p193_1182", question: "All at once the old lady burst into tears.", options: ["Immediately", "Suddenly", "Quickly", "Usually"], correct: 1, explanation: "all at once「突然」。", translation: "突然，その老婦人はわっと泣き出した。", onePoint: "突然系。" },
{ id: "c23p193_1183", question: "Everything is probably all right. All the same, I had better go and make sure.", options: ["And", "Besides", "For", "Nevertheless"], correct: 3, explanation: "all the same「それでも」。", translation: "たぶんすべて順調に進んでいるのだろう。それでもやはり私が行って確認したほうがよい。", onePoint: "逆接。" },
{ id: "c23p193_1184", question: "By any chance, could you be Mr. White?", options: ["By and by", "By the way", "By some possibility", "By accident"], correct: 2, explanation: "by any chance「ひょっとして」。", translation: "ひょっとして，ホワイトさんでいらっしゃいますか。", onePoint: "丁寧な推測。" },
{ id: "c23p193_1185", question: "Can you finish the work on your own?", options: ["alone", "completely", "with your best effort", "as you like"], correct: 0, explanation: "on one’s own「ひとりで」。", translation: "ひとりでその仕事を終えることができますか。", onePoint: "alone と同義。" },
{ id: "c23p193_1186", question: "Fred is good at all sports. At tennis he is second to none.", options: ["unsuccessful", "insignificant", "behind", "unbeatable"], correct: 3, explanation: "second to none「誰にも劣らない」。", translation: "フレッドはあらゆるスポーツが得意だ。テニスでは誰にも劣らない。", onePoint: "最上級表現。" },
{ id: "c23p193_1187", question: "I was ill at ease while I was waiting for my girlfriend at Shinjuku.", options: ["uncomfortable", "useless", "happy", "alone"], correct: 0, explanation: "ill at ease「落ち着かない」。", translation: "私は新宿でガールフレンドを待っている間落ち着かなかった。", onePoint: "ease の反対。" },

        ];

        // --- STATE & STORAGE ---
        let currentChapterIdx = 0;
        let currentQuestionIdx = 0;
        let isAnswered = false;
        let isReviewMode = false;
        let activeQuestions = [];
        let bookmarks = JSON.parse(localStorage.getItem('grammar_bookmarks') || '[]');
        let selectedChapterIds = new Set();
        let isRandomMode = false;
        let score = 0;


        function init() { showChapterMenu(); }

        function showChapterMenu() {
            isReviewMode = false;
            isRandomMode = false;
            selectedChapterIds.clear();
            document.getElementById('header-stats').classList.add('hidden');
            document.getElementById('explanation-area').classList.add('hidden');
            const container = document.getElementById('main-container');
            const bCount = bookmarks.length;

            container.innerHTML = `
                <div class="space-y-6">
                    <h2 class="text-3xl font-black">学習メニュー</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">

                    ${chapters.map((ch, idx) => `
                        <div class="flex items-center gap-3">
                            <input type="checkbox" onchange="toggleChapterSelection('${ch.id}')" class="w-6 h-6 border-3 border-black rounded cursor-pointer">
                            <button onclick="startChapter(${idx})" class="neo-button flex-1 p-6 text-left flex justify-between items-center group hover:bg-blue-50">

                    `).join('')}

            `;
        }
　　　　　function toggleChapterSelection(id) {
            if (selectedChapterIds.has(id)) selectedChapterIds.delete(id);
            else selectedChapterIds.add(id);
            document.getElementById('random-start-btn').disabled = selectedChapterIds.size === 0;
        }

        function startRandomTest() {
            if (selectedChapterIds.size === 0) return;
            isRandomMode = true;
            score = 0;
            
            let pool = chapters
                .filter(ch => selectedChapterIds.has(ch.id))
                .flatMap(ch => ch.questions);
            
            activeQuestions = pool.sort(() => Math.random() - 0.5).slice(0, 10);
            currentQuestionIdx = 0;
            
            document.getElementById('header-stats').classList.remove('hidden');
            document.getElementById('chapter-label').innerText = `🎲 Random Test (10)`;
            renderQuestion();
        }

        function startChapter(idx) {
            currentChapterIdx = idx;
            currentQuestionIdx = 0;
            activeQuestions = chapters[idx].questions;
            isReviewMode = false;
            document.getElementById('header-stats').classList.remove('hidden');
            document.getElementById('chapter-label').innerText = `Chapter ${idx + 1}`;
            renderQuestion();
        }

        function startReviewMode() {
            if (bookmarks.length === 0) return;
            const allQs = chapters.flatMap(c => c.questions);
            activeQuestions = bookmarks.map(id => allQs.find(q => q.id === id)).filter(Boolean);
            if (activeQuestions.length === 0) { bookmarks = []; localStorage.setItem('grammar_bookmarks', '[]'); showChapterMenu(); return; }
            currentQuestionIdx = 0; isReviewMode = true;
            document.getElementById('header-stats').classList.remove('hidden');
            document.getElementById('chapter-label').innerText = `🌟 Review Mode`;
            renderQuestion();
        }

        function renderQuestion() {
            isAnswered = false;
            const q = activeQuestions[currentQuestionIdx];
            const container = document.getElementById('main-container');
            const progressText = document.getElementById('progress-text');
            document.getElementById('explanation-area').classList.add('hidden');
            progressText.innerText = `${currentQuestionIdx + 1} / ${activeQuestions.length}`;
            
            container.innerHTML = `
                <div class="neo-card p-8 mb-6">
                    <div class="mb-4"><span class="bg-black text-white px-2 py-1 rounded text-xs font-bold uppercase">Question</span></div>
                    <h2 class="text-2xl md:text-3xl font-black">${q.question}</h2>
                    <div class="grid grid-cols-1 gap-4 mt-8">
                        ${q.options.map((opt, i) => `
                            <button onclick="checkAnswer(${i})" class="neo-button p-4 text-left text-lg md:text-xl hover:bg-blue-50">${opt}</button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function checkAnswer(idx) {
            if (isAnswered) return;
            const q = activeQuestions[currentQuestionIdx];
            const isCorrect = idx === q.correct;
            if (isCorrect) playEffect(true);if (isCorrect) score++;else playEffect(false);
            showExplanation(isCorrect);
            isAnswered = true;
        }

        function playEffect(isCorrect) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            if (isCorrect) {
                osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1046.50, ctx.currentTime + 0.1);
                document.getElementById('correct-ping').classList.add('ping-animate');
                setTimeout(() => document.getElementById('correct-ping').classList.remove('ping-animate'), 800);
            } else {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(110, ctx.currentTime);
            }
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.4);
        }

        function showExplanation(isCorrect) {
            const q = activeQuestions[currentQuestionIdx];
            const expArea = document.getElementById('explanation-area');
            const expContent = document.getElementById('explanation-content');
            const onePoint = document.getElementById('one-point-text');
            const bookmarkIcon = document.getElementById('bookmark-icon');
            const bookmarkBtn = document.getElementById('bookmark-btn');

            expArea.classList.remove('hidden');
            const isBookmarked = bookmarks.includes(q.id);
            bookmarkIcon.innerText = isBookmarked ? "★" : "☆";
            bookmarkBtn.className = `neo-button px-3 py-1 flex items-center gap-1 text-sm ${isBookmarked ? 'bg-yellow-400' : 'bg-white'}`;
            bookmarkBtn.onclick = () => {
                const idx = bookmarks.indexOf(q.id);
                if (idx > -1) bookmarks.splice(idx, 1); else bookmarks.push(q.id);
                localStorage.setItem('grammar_bookmarks', JSON.stringify(bookmarks));
                showExplanation(isCorrect);
            };

            let finalSentence = q.question;
            let speakSentence = "";

            if (q.question.includes('(　　　)')) {
                const filledText = q.options[q.correct];
                finalSentence = q.question.replace('(　　　)', `<span class="underline text-blue-600">${filledText}</span>`);
                speakSentence = q.question.replace('(　　　)', filledText);
            } else if (q.question.includes('( ')) {
                const filledText = q.options[q.correct];
                finalSentence = `<span class="text-blue-600 font-bold">${filledText}</span>`;
                speakSentence = filledText;
            } else {
                speakSentence = q.question;
            }

            // 特殊文字の除去（クイズ形式の記号などを消去して読み上げるため）
            speakSentence = speakSentence.replace(/[()（）　]/g, " ").trim();

            expContent.innerHTML = `
                <p class="text-2xl font-black ${isCorrect ? 'text-green-600' : 'text-red-600'}">${isCorrect ? '正解！' : '不正解...'}</p>
                <div class="bg-gray-100 p-4 rounded-xl border-2 border-black">
                    <div class="flex justify-between items-center mb-2">
                        <p class="text-xl font-bold leading-relaxed">${finalSentence}</p>
                        <button onclick="speak('${speakSentence.replace(/'/g, "\\'")}')" class="neo-button p-3 bg-white flex flex-col items-center gap-1 min-w-[60px]" title="正解文を読み上げる">
                            <span class="text-xl">🔊</span>
                            <span class="text-[10px] font-bold">Listen</span>
                        </button>
                    </div>
                    <p class="text-gray-600 text-sm mt-2 border-t border-gray-200 pt-2">和訳：${q.translation || '（和訳準備中）'}</p>
                </div>
                <div class="prose prose-sm max-w-none text-gray-800">
                    <p>${q.explanation}</p>
                </div>
            `;
            onePoint.innerText = q.onePoint || '特になし';
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function speak(t) {
            const u = new SpeechSynthesisUtterance(t); 
            u.lang = 'en-US';
            u.rate = 0.9; 
            speechSynthesis.cancel(); 
            speechSynthesis.speak(u);
        }

        document.getElementById('next-btn').onclick = () => {
            currentQuestionIdx++;
            if (currentQuestionIdx < activeQuestions.length) renderQuestion(); else showComplete();
        };

        function showComplete() {
            const scoreHtml = isRandomMode ? `<p class="text-3xl font-black text-blue-600 mb-4">Score: ${score} / ${activeQuestions.length}</p>` : '';
            document.getElementById('main-container').innerHTML = `
                <div class="neo-card p-12 text-center bg-green-50">
                    <h2 class="text-4xl font-black mb-4">COMPLETE!</h2>
                    ${scoreHtml}
                    <p class="mb-8 text-xl">お疲れ様でした。セッションを完了しました。</p>
                    <button onclick="showChapterMenu()" class="neo-button neo-button-primary px-8 py-3">メニューへ戻る</button>
                </div>
            `;
            document.getElementById('explanation-area').classList.add('hidden');
        }
    </script>
</body>
</html>
